[project]
name = "ai-assist"
version = "0.1.0"
description = "AI-assisted resume editing, scoring, and word/pdf generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic[email]>=2.0",
    "python-docx>=1.1.0",
    "pypdf>=4.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "common",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv.sources]
common = { path = "../common", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
