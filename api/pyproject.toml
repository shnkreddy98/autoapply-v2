[project]
name = "api"
version = "0.1.0"
description = "Multi-user HTTP API for autoapply-v2: Google Sign-In, sessions, RLS-scoped data access."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.3.4",
    "psycopg-pool>=3.2.0",
    "common",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = true

[tool.uv.sources]
common = { path = "../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]
