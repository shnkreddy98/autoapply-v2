[project]
name = "common"
version = "0.1.0"
description = "Shared infra for autoapply-v2: Postgres pool, MinIO/S3 storage, job-queue helpers."
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.3.4",
    "psycopg-pool>=3.2.0",
    "boto3>=1.34.0",
    "cryptography>=42.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # termui's colored path; optional at runtime (packages that print declare it)
    "rich>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]
