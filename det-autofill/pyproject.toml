[project]
name = "det-autofill"
version = "0.1.0"
description = "Deterministic job-application form filler: ARIA in, actions out; LLM only as one-shot fallback"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.27.2,<2",  # auto-browse runs on mcp 1.x; 2.x changed the client API
]

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["det_autofill"]
