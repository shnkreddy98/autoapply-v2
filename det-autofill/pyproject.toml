[project]
name = "det-autofill"
version = "0.1.0"
description = "Deterministic job-application form filler: ARIA in, actions out; LLM only as one-shot fallback"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.28.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["det_autofill"]
