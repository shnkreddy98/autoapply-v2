<!doctype html><html><head><meta charset="utf-8"><title>Ashby fixture</title></head><body>
<form class="ashby-application-form">
  <div data-field-entry-id="_systemfield_name">
    <label for="_systemfield_name">Name</label>
    <input type="text" id="_systemfield_name" name="_systemfield_name">
  </div>
  <div data-field-entry-id="_systemfield_email">
    <label for="_systemfield_email">Email</label>
    <input type="text" id="_systemfield_email" name="_systemfield_email">
  </div>
  <div data-field-entry-id="_systemfield_resume">
    <label for="_systemfield_resume">Resume</label>
    <input type="file" id="_systemfield_resume" name="_systemfield_resume">
  </div>
  <div data-field-entry-id="q1">
    <label for="q1">LinkedIn Profile URL</label>
    <input type="text" id="q1" name="a1b2c3">
  </div>
  <div data-field-entry-id="q2">
    <label for="q2">What are your salary expectations?</label>
    <input type="text" id="q2" name="d4e5f6">
  </div>
  <div data-field-entry-id="q3">
    <label for="q3">Current company</label>
    <input type="text" id="q3" name="g7h8i9">
  </div>
  <div data-field-entry-id="q4">
    <fieldset role="radiogroup" aria-label="Do you now or will you in the future require visa sponsorship?">
      <label><input type="radio" name="sponsor" value="yes"> Yes</label>
      <label><input type="radio" name="sponsor" value="no"> No</label>
    </fieldset>
  </div>
</form>
<script src="./_react-tracker.js"></script>
<script>document.querySelectorAll('input[type=text]').forEach(window.trackLikeReact);</script>
</body></html>
