<!doctype html><html><head><meta charset="utf-8"><title>Trap fixture</title>
<style>.visually-hidden{position:absolute;opacity:0;width:1px;height:1px}</style></head><body>
<form id="apply">
  <label for="auth_wo">Are you legally authorized to work in the United States without requiring sponsorship?</label>
  <select id="auth_wo"><option value="">Select...</option><option>Yes</option><option>No</option></select>

  <fieldset><legend>Are you a U.S. citizen?</legend>
    <label><input type="radio" name="citizen" value="yes"> Yes</label>
    <label><input type="radio" name="citizen" value="no"> No</label>
  </fieldset>

  <label for="auth_type">Which of the following best describes your work authorization?</label>
  <select id="auth_type"><option value="">Select...</option><option>U.S. Citizen</option>
    <option>Permanent Resident</option><option>H-1B Visa</option><option>F-1 OPT</option></select>

  <!-- Workday's anti-bot field: the token tier alone would call it a portfolio URL -->
  <div data-automation-id="formField-website">
    <label for="website">Enter website. This input is for robots only, do not enter if you're human.</label>
    <input type="text" id="website" name="website">
  </div>

  <label for="otp">Enter the verification code sent to your email</label>
  <input type="text" id="otp" name="otp_code">

  <label id="gender_lbl">Gender</label>
  <div class="select__control">
    <div class="select__single-value">Female</div>
    <input role="combobox" id="gender_rs" aria-labelledby="gender_lbl" aria-controls="gender_listbox" aria-expanded="false">
  </div>

  <label for="eeo_gender_2">What is your gender?</label>
  <select id="eeo_gender_2"><option value="">Select...</option><option>Man</option><option>Woman</option><option>Non-binary</option></select>

  <label for="cv">Resume</label>
  <input type="file" id="cv" name="cv" class="visually-hidden">

  <h3>Professional References</h3>
  <div>
    <label for="ref_name">Full name</label><input type="text" id="ref_name">
    <label for="ref_phone">Phone</label><input type="tel" id="ref_phone">
  </div>
</form>
</body></html>
