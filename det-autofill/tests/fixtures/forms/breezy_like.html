<!doctype html><html><head><meta charset="utf-8"><title>Breezy-like fixture</title></head><body>
<!-- Breezy HR application (2026-09-14): each label is an <h3> before its input, a hidden
     validation message follows each input, the resume input is display:none behind an
     "Upload Resume" link, custom questions sit in li.question with an <h3>, and the EEO
     radios have only a heading inside div.multiplechoice. -->
<form>
  <div class="section">
    <h3><span>Full Name</span><span class="required">*</span></h3>
    <input name="cName" type="text" placeholder="Full Name" required>
    <div class="error-container ng-hide" style="display:none"><span class="error">A full name is required</span></div>
    <h3><span>Email Address</span><span class="required">*</span></h3>
    <input name="cEmail" type="email" placeholder="Email Address" required>
    <div class="error-container ng-hide" style="display:none"><span class="error">An email is required</span></div>
  </div>
  <ul><li class="question"><div class="dropdown"><h3><span>Do you have a high school diploma or GED?</span><span class="required">*</span></h3>
    <div class="dropdown-container"><div class="select-wrapper"><select name="section_q1" required><option value=""></option><option>Yes</option><option>No</option></select></div></div></div></li></ul>
  <div class="multiplechoice"><h3>Race or Ethnicity</h3><ul class="options">
    <li><input id="race_white" type="radio" name="race_ethnicity" value="white"><label for="race_white"><span>White (not Hispanic or Latino)</span></label></li>
    <li><input id="race_asian" type="radio" name="race_ethnicity" value="asian"><label for="race_asian"><span>Asian (not Hispanic or Latino)</span></label></li>
  </ul></div>
  <input id="main-attachment" name="cResume" style="display:none" type="file" required>
</form>
</body></html>
