<!doctype html><html><head><meta charset="utf-8"><title>Posting fixture</title></head><body>
<!-- A Workday-style posting page (GM, 2026-09-14): a job-search box and a location
     filter are visible beside the posting's "Apply" button. "Apply" opens the form.
     #bare drops the form so Apply is all there is. -->
<header><label for="q">Search for jobs</label><input id="q" type="search">
  <label for="loc">Location</label><input id="loc"></header>
<main id="main"><h1>Senior Data Engineer</h1><p>Build pipelines.</p>
  <a role="button" id="apply" href="#">Apply</a></main>
<script>
  if (location.hash === '#form') document.addEventListener('DOMContentLoaded', () => openForm());
  document.getElementById('apply').addEventListener('click', (e) => {
    e.preventDefault();
    if (location.hash === '#bare') return;
    if (location.hash === '#popup') {
      // Hirebridge: Apply is javascript:popUp(url) — the form opens in a new window
      window.open(location.href.split('#')[0] + '#form', '_blank');
      return;
    }
    if (location.hash === '#chooser' && !document.getElementById('manual')) {
      // Workday: Apply opens a dialog; the form comes after "Apply Manually"
      document.body.insertAdjacentHTML('beforeend', '<div role="dialog" id="dlg"><button>Autofill with Resume</button><button id="manual">Apply Manually</button></div>');
      document.getElementById('manual').addEventListener('click', () => { document.getElementById('dlg').remove(); openForm(); });
      return;
    }
    openForm();
  });
  function openForm() {
    document.getElementById('main').innerHTML =
      '<form><label for="fn">First Name*</label><input id="fn" required>' +
      '<label for="em">Email*</label><input id="em" type="email" required>' +
      '<button type="button" id="send">Submit Application</button></form>';
  }
</script>
</body></html>
