[project]
name = "auto-browse"
version = "0.1.0"
description = "Cheap LLM driving a browser through a deterministic accessibility-tree pruning proxy."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.27.2",
    "openai>=2.41.1",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
    "starlette>=0.40.0",
    "psycopg[binary]>=3.3.4",
    "common",
]

[project.scripts]
playwright-proxy = "proxy.server:main"

[tool.uv]
package = true

[tool.uv.sources]
common = { path = "../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proxy", "agent"]

[dependency-groups]
dev = [
    "playwright>=1.60.0",
    "pytest>=9.1.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
