services:
  # Headed Playwright MCP, watchable over noVNC at http://localhost:6080/vnc.html
  playwright:
    build: ./browser
    init: true
    ports:
      - "8931:8931"   # Playwright MCP (HTTP)
      - "6080:6080"   # noVNC web viewer
    volumes:
      - ./output/.playwright-mcp:/home/node/.playwright-mcp
      # resume PDF staged by the apply flow, uploaded during applications
      - ./output/resume:/resume:ro

  # Text-extracting proxy MCP — the only browser surface the agent connects to.
  proxy:
    build:
      # repo-root context so the local `common` package (../common in uv.lock) is reachable
      context: ..
      dockerfile: auto-browse/proxy/Dockerfile
    depends_on:
      - playwright
    environment:
      PLAYWRIGHT_MCP_URL: http://playwright:8931/mcp
      SNAPSHOT_DIR: /data
    volumes:
      # read the snapshot .yml files Playwright MCP writes (shared, read-only)
      - ./output:/data:ro
    ports:
      - "8932:8932"
