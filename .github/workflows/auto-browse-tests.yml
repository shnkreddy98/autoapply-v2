name: auto-browse tests

on:
  pull_request:
    paths:
      - "auto-browse/**"
      - ".github/workflows/auto-browse-tests.yml"
  push:
    branches: [main]
    paths:
      - "auto-browse/**"
      - ".github/workflows/auto-browse-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auto-browse
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest proxy/tests -q
